name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify install
        run: python -c "import pa_agent; print('OK')"

      - name: Check Harness Engineering
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\check_project_harness.ps1

      - name: Offline smoke tests
        run: >-
          python -m pytest
          tests/unit/test_api_key_configured.py
          tests/unit/test_settings_round_trip.py
          tests/unit/test_client_factory.py
          -q
